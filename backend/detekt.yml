build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreDataClasses: true
    ignoreDefaultParameters: true
  LargeClass:
    excludes:
      - '**/wrappers/InstrumentedFlow.kt'
      - '**/wrappers/VizScope.kt'
      - '**/routes/ScenarioRunnerRoutes.kt'
  TooManyFunctions:
    excludes:
      - '**/wrappers/**'
      - '**/scenarios/**'
      - '**/test/**'
  CyclomaticComplexMethod:
    threshold: 20

exceptions:
  TooGenericExceptionCaught:
    excludes:
      - '**/wrappers/**'

naming:
  FunctionNaming:
    excludes:
      - '**/test/**'
  MatchingDeclarationName:
    active: false
  MemberNameEqualsClassName:
    active: true

style:
  WildcardImport:
    active: false
  MaxLineLength:
    active: false
  UnusedImports:
    active: false
  MagicNumber:
    excludes:
      - '**/test/**'
      # The Basics demos' scripts: each number is the length of one step, in milliseconds.
      - '**/scenarios/BasicScenarios.kt'
      # The Channels demos' scripts, the same way.
      - '**/scenarios/ChannelScenarios.kt'
      # The Flow demos' scripts, the same way.
      - '**/scenarios/FlowScenarios.kt'
      # The Patterns demos' scripts, the same way.
      - '**/scenarios/PatternScenarios.kt'
      # The Sync demos' scripts, the same way.
      - '**/scenarios/SyncScenarios.kt'
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreHashCodeFunction: true
    ignoreEnums: true
    ignoreNamedArgument: true
  ForbiddenComment:
    active: false

coroutines:
  GlobalCoroutineUsage:
    active: true
