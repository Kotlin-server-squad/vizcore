# Local development stack. Both images build from the repository root context so the backend
# image can reach its SDK modules and the frontend image can reach shared/api-types.
# Host ports are overridable so the stack can come up on a machine where 8080 or 3000 is
# already taken: BACKEND_PORT=18081 FRONTEND_PORT=13001 docker compose up -d
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # The demo settings (docs/DEPLOYMENT.md), overridable from the shell like the ports.
      - MAX_CONCURRENT_DEMOS=${MAX_CONCURRENT_DEMOS:-3}
      - MAX_DEMO_RUN_SECONDS=${MAX_DEMO_RUN_SECONDS:-60}
      - DEMO_TIME_SCALE=${DEMO_TIME_SCALE:-1.0}
      # The look experiment (docs/guides/look-experiment.md): off unless switched on.
      - LOOK_EXPERIMENT_ENABLED=${LOOK_EXPERIMENT_ENABLED:-false}
      - LOOK_EXPERIMENT=${LOOK_EXPERIMENT:-classic:25,a:25,b:25,c:25}
      - LOOK_SURVEY_URL=${LOOK_SURVEY_URL:-}
    healthcheck:
      # /api/ready is the readiness probe (HealthRoutes); "/" is not a route and would make
      # `curl -f` fail forever. curl ships with the eclipse-temurin:21-jre runtime image.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # The dev image keeps the repository layout, so the app lives at /app/frontend.
      - ./frontend/src:/app/frontend/src
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # vite.config.ts reads VITE_PROXY_TARGET for its /api proxy. VITE_API_URL was never
      # read by anything.
      - VITE_PROXY_TARGET=http://backend:8080
      # The Connect wizard would otherwise show the proxy target, a name only this compose
      # network can resolve; an app on the host reaches the backend on its published port (#252).
      - VITE_VIZCORE_BACKEND_URL=http://localhost:${BACKEND_PORT:-8080}
