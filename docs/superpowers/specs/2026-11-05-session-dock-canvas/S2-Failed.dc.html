<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 2: IDE dock, a failed run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 0 24px; min-height: 52px; border-bottom: 1px solid {{t.border}}; background: {{t.surface}}">
    <span style="font-weight: 700; font-size: 15px">Coroutine Visualizer</span>
    <a href="#" style="font-size: 14px; color: {{t.muted}}; text-decoration: none">Sessions</a>
    <a href="#" style="font-size: 14px; color: {{t.muted}}; text-decoration: none">Gallery</a>
  </nav>

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid {{t.border}}">
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">{{title}}</h1>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: {{status.tint}}; color: {{status.text}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{status.dot}}"></span>{{status.label}}</span>
    <span style="font-size: 13px; color: {{t.muted}}">{{meta}}</span>
    <div style="flex: 1"></div>
    <sc-for list="{{actions}}" as="b" hint-placeholder-count="4">
      <button type="button" aria-label="{{b.aria}}" style="font: inherit; font-size: 13px; font-weight: {{b.weight}}; padding: 8px 14px; border-radius: 8px; border: {{b.border}}; background: {{b.bg}}; color: {{b.color}}">{{b.label}}</button>
    </sc-for>
  </header>

  <section aria-label="Coroutine tree" style="flex: 1; min-height: 360px; margin: 12px 24px 0; display: flex; flex-direction: column; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface2}}">
    <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid {{t.border}}">
      <div role="group" aria-label="View" style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: {{t.surface3}}">
        <button type="button" aria-pressed="true" style="font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: 0; background: {{t.surface}}; color: {{t.text}}">Tree</button>
        <button type="button" aria-pressed="false" style="font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 0; background: transparent; color: {{t.muted}}">Graph</button>
      </div>
      <span style="width: 8px"></span>
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{f.pressed}}" style="font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}">{{f.label}}</button>
      </sc-for>
      <div style="flex: 1"></div>
      <button type="button" style="font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid {{t.border}}; background: transparent; color: {{t.text}}">How to read the tree</button>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px">
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; border-top: {{row.top}}; padding: 0 8px">
              <sc-for list="{{row.nodes}}" as="n" hint-placeholder-count="4">
                <div style="display: flex; flex-direction: column; align-items: center">
                  <span aria-hidden="true" style="width: 2px; height: {{n.stub}}; background: {{t.line}}"></span>
                  <button type="button" aria-pressed="{{n.pressed}}" style="display: flex; flex-direction: column; gap: 3px; min-width: 124px; padding: 8px 12px; border-radius: 8px; border: {{n.border}}; background: {{n.bg}}; font: inherit; color: inherit; text-align: left">
                    <span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{n.dot}}"></span>{{n.name}}</span>
                    <span style="font-size: 11px; color: {{n.color}}">{{n.label}}</span>
                    <span style="font-size: 11px; color: {{n.noteColor}}">{{n.note}}</span>
                  </button>
                </div>
              </sc-for>
            </div>
            <span aria-hidden="true" style="width: 2px; height: {{row.below}}; background: {{t.line}}"></span>
          </sc-for>
        </div>
  </section>

  <section aria-label="Details dock" style="margin: 12px 24px 16px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; margin-top: 6px; border-radius: 2px; background: {{t.surface3}}"></div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 10px; border-bottom: 1px solid {{t.border}}">
      <sc-for list="{{tiles}}" as="m" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{t.muted}}">{{m.label}}</span><span style="font-size: 18px; font-weight: 700; color: {{m.color}}">{{m.value}}</span></div>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid {{t.border}}">
      <div role="tablist" aria-label="Dock" style="display: flex; flex-wrap: wrap; gap: 4px">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
          <button type="button" role="tab" aria-selected="{{tab.selected}}" style="font: inherit; font-size: 12px; font-weight: {{tab.weight}}; padding: 6px 12px; border-radius: 6px; border: 0; background: {{tab.bg}}; color: {{tab.color}}">{{tab.label}}</button>
        </sc-for>
      </div>
      <div style="flex: 1"></div>
      <button type="button" aria-label="Fold the dock" style="font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 0; background: transparent; color: {{t.muted}}">Fold</button>
    </div>

    <div role="tabpanel" aria-label="Events" style="display: flex; flex-direction: column">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid {{t.border}}">
        <span style="font-size: 12px; color: {{t.muted}}">Show</span>
        <sc-for list="{{eventFilters}}" as="f" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{f.pressed}}" style="font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}">{{f.label}}</button>
        </sc-for>
      </div>
      <table style="width: 100%; border-collapse: collapse; font-size: 12px">
        <thead>
          <tr style="text-align: left; color: {{t.muted}}">
            <th scope="col" style="padding: 8px 16px; font-weight: 500; width: 70px">Time</th>
            <th scope="col" style="padding: 8px 16px; font-weight: 500; width: 200px">Coroutine</th>
            <th scope="col" style="padding: 8px 16px; font-weight: 500">What happened</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{events}}" as="e" hint-placeholder-count="5">
            <tr style="border-top: 1px solid {{t.border}}">
              <td style="padding: 7px 16px; font-family: 'JetBrains Mono', monospace; color: {{t.muted}}">{{e.at}}</td>
              <td style="padding: 7px 16px; font-family: 'JetBrains Mono', monospace"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{e.dot}}"></span>{{e.who}}</span></td>
              <td style="padding: 7px 16px; color: {{e.color}}; font-style: {{e.style}}"><span style="font-size: 10px; font-style: normal; padding: {{e.tagPad}}; margin-right: 8px; border-radius: 4px; background: {{t.surface3}}; color: {{t.muted}}">{{e.tag}}</span>{{e.text}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const isLight = (this.props.theme ?? 'dark') === 'light';
    const t = isLight
      ? { bg: '#fafafa', surface: '#ffffff', surface2: '#f4f4f5', surface3: '#e4e4e7', border: '#e4e4e7', text: '#18181b', muted: '#52525b', primary: '#006fee', sel: '#005bc4', hl: 'rgba(0,111,238,0.12)' }
      : { bg: '#0a0a0b', surface: '#131316', surface2: '#18181b', surface3: '#27272a', border: '#27272a', text: '#fafafa', muted: '#a1a1aa', primary: '#006fee', sel: '#4da3ff', hl: 'rgba(77,163,255,0.16)' };
    t.line = isLight ? '#a1a1aa' : '#52525b';
    t.link = isLight ? '#005bc4' : '#4da3ff';
    const pal = isLight
      ? { ACTIVE: ['#006fee', '#005bc4'], SUSPENDED: ['#f5a524', '#936316'], WAITING: ['#9353d3', '#6020a0'], COMPLETED: ['#17c964', '#0e793c'], FAILED: ['#f31260', '#c20e4d'], CANCELLED: ['#a1a1aa', '#52525b'] }
      : { ACTIVE: ['#006fee', '#4da3ff'], SUSPENDED: ['#f5a524', '#f5a524'], WAITING: ['#9353d3', '#b47cff'], COMPLETED: ['#17c964', '#17c964'], FAILED: ['#f31260', '#ff6b95'], CANCELLED: ['#71717a', '#a1a1aa'] };
    const names = { ACTIVE: 'Active', SUSPENDED: 'Suspended', WAITING: 'Waiting for children', COMPLETED: 'Completed', FAILED: 'Failed', CANCELLED: 'Cancelled' };
    const s = {};
    for (const k of Object.keys(pal)) s[k] = { dot: pal[k][0], text: pal[k][1], tint: pal[k][0] + '26', label: names[k] };
    const node = (name, st, o) => {
      o = o || {};
      const noteColors = { wait: s.SUSPENDED.text, hold: t.sel, fail: s.FAILED.text, muted: t.muted };
      return {
        name, dot: s[st].dot, color: s[st].text, label: o.detail ? s[st].label + ' · ' + o.detail : s[st].label,
        note: o.note || '', noteColor: noteColors[o.kind || 'muted'], pressed: o.selected ? 'true' : 'false',
        border: o.selected ? '2px solid ' + t.sel : '1px solid ' + t.border, bg: t.surface, stub: o.child ? '14px' : '0px'
      };
    };
    const chip = (label, on) => ({ label, pressed: on ? 'true' : 'false', border: on ? t.sel : t.border, bg: on ? t.hl : 'transparent', color: on ? t.text : t.muted });
    const tab = (label, on) => ({ label, selected: on ? 'true' : 'false', weight: on ? 600 : 400, bg: on ? t.surface3 : 'transparent', color: on ? t.text : t.muted });
    const btn = (label, primary, aria, disabled) => ({
      label, aria: aria || label, weight: primary ? 600 : 400,
      border: primary && !disabled ? '0' : '1px solid ' + t.border,
      bg: disabled ? t.surface3 : primary ? t.primary : 'transparent',
      color: disabled ? t.muted : primary ? '#ffffff' : t.text
    });
    return {
      t, s,
      title: 'Exception: One Backend Call Fails',
      status: { ...s.FAILED, label: 'Failed after 12.0 s' },
      meta: 'Loyalty service answered HTTP 500 (the demo\'s simulated error) · 6 coroutines',
      actions: [btn('Run again', true), btn('Replay'), btn('Share'), btn('More', false, 'More actions: Reset session, Clear events, Export, Checks')],
      filters: [chip('All 6', true), chip('Completed 2'), chip('Failed 2'), chip('Cancelled 2')],
      rows: [
        { top: '0', below: '14px', nodes: [node('load-account-page', 'FAILED', { note: 'failed because a child failed' })] },
        { top: '2px solid ' + t.line, below: '0px', nodes: [
          node('fetch-delivery-status', 'COMPLETED', { child: true }), node('fetch-profile', 'COMPLETED', { child: true }),
          node('fetch-orders', 'CANCELLED', { child: true, note: 'after the failure' }), node('fetch-invoices', 'CANCELLED', { child: true, note: 'after the failure' }),
          node('fetch-loyalty-points', 'FAILED', { child: true, note: 'where the failure started', kind: 'fail', selected: true })
        ] }
      ],
      tiles: [
        { label: 'Completed', value: '2', color: s.COMPLETED.text },
        { label: 'Failed', value: '2', color: s.FAILED.text },
        { label: 'Cancelled', value: '2', color: s.CANCELLED.text },
        { label: 'Peak live', value: '6', color: t.text },
        { label: 'Observed threads', value: '3', color: t.text },
        { label: 'Duration', value: '12.0 s', color: t.text }
      ],
      tabs: [tab('Inspector'), tab('Threads'), tab('Events', true), tab('Learn')],
      eventFilters: [chip('The failure and the cancellations after it', true), chip('fetch-loyalty-points only'), chip('All events')],
      events: [
        { at: '12.0 s', who: 'fetch-loyalty-points', text: 'Failed: Loyalty service answered HTTP 500', dot: s.FAILED.dot, color: s.FAILED.text, tag: '', tagPad: '0', style: 'normal' },
        { at: '', who: '', text: 'load-account-page is a plain launch, so a failing child cancels the children still running', dot: 'transparent', color: t.muted, tag: 'Explanation', tagPad: '2px 6px', style: 'italic' },
        { at: '12.0 s', who: 'fetch-orders', text: 'Cancelled while suspended in delay', dot: s.CANCELLED.dot, color: t.text, tag: '', tagPad: '0', style: 'normal' },
        { at: '12.0 s', who: 'fetch-invoices', text: 'Cancelled while suspended in delay', dot: s.CANCELLED.dot, color: t.text, tag: '', tagPad: '0', style: 'normal' },
        { at: '12.0 s', who: 'load-account-page', text: 'Failed with the same exception, passed up from its child', dot: s.FAILED.dot, color: s.FAILED.text, tag: '', tagPad: '0', style: 'normal' }
      ]
    };
  }
}
</script>
</body>
</html>
