name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  PNPM_VERSION: '9'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test and build the JVM deliverables: core + client jars, and the
  # standalone agent and CLI fat jars
  # ---------------------------------------------------------------------------
  build-core:
    name: Build JVM Artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: >-
          ./gradlew
          :coroutine-viz-core:test :coroutine-viz-client:test
          :coroutine-viz-cli:test :coroutine-viz-agent:test

      - name: Build JARs
        run: >-
          ./gradlew
          :coroutine-viz-core:jar :coroutine-viz-core:sourcesJar
          :coroutine-viz-client:jar
          :coroutine-viz-cli:shadowJar :coroutine-viz-agent:shadowJar

      # One upload takes all four patterns and fails only when NONE match, so check that
      # every module produced its jar before anything is uploaded.
      - name: Check every expected JAR exists
        run: |
          for JAR in \
            coroutine-viz-core/build/libs/coroutine-viz-core-*[0-9].jar \
            coroutine-viz-core/build/libs/coroutine-viz-core-*-sources.jar \
            coroutine-viz-client/build/libs/coroutine-viz-client-*[0-9].jar \
            coroutine-viz-cli/build/libs/coroutine-viz-cli-*-all.jar \
            coroutine-viz-agent/build/libs/coroutine-viz-agent-*-all.jar; do
            [[ -f "$JAR" ]] || { echo "error: missing ${JAR}" >&2; exit 1; }
            echo "ok: ${JAR}"
          done

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: jvm-jars
          path: |
            backend/coroutine-viz-core/build/libs/*.jar
            backend/coroutine-viz-client/build/libs/*.jar
            backend/coroutine-viz-cli/build/libs/*-all.jar
            backend/coroutine-viz-agent/build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2: Publish coroutine-viz-core + coroutine-viz-client to GitHub Packages,
  # before the Release exists, so a release never points at a missing SDK
  # ---------------------------------------------------------------------------
  publish-sdk:
    name: Publish SDK
    needs: build-core
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-maven.yml

  # ---------------------------------------------------------------------------
  # Job 3: Build frontend static assets
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Archive frontend dist
        run: tar -czf frontend-dist.tar.gz -C dist .

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/frontend-dist.tar.gz
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4: Create GitHub Release with all artifacts and their checksums
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-core, build-frontend, publish-sdk]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Download JARs
        uses: actions/download-artifact@v8
        with:
          name: jvm-jars
          path: release-assets/jvm

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: release-assets/frontend

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          CHANGELOG=$(scripts/generate-changelog.sh)
          # Write to file for the release body (handles multiline safely)
          echo "$CHANGELOG" > release-notes.md

      # One flat directory for upload, plus SHA-256 checksums of every asset.
      - name: Collect assets and checksums
        run: |
          mkdir -p release-assets/upload
          find release-assets/jvm -name '*.jar' -exec cp {} release-assets/upload/ \;
          cp release-assets/frontend/frontend-dist.tar.gz release-assets/upload/
          cd release-assets/upload
          # core, core sources, client, CLI and agent jars plus the frontend bundle.
          COUNT=$(find . -maxdepth 1 -type f | wc -l)
          if [[ "$COUNT" -ne 6 ]]; then
            echo "error: expected 6 release assets, found ${COUNT}:" >&2
            ls -1 >&2
            exit 1
          fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Coroutine Visualizer ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: release-assets/upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
