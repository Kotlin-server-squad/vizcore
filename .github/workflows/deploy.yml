name: Deploy

on:
  push:
    branches: [main]
    # A release tag also publishes images tagged with it (TAG=v1.2.0 in docs/DEPLOYMENT.md).
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  PNPM_VERSION: '9'

jobs:
  # Images are only published from a commit whose checks pass: the same lint and tests as
  # ci-backend.yml and ci-frontend.yml run here first, and both image jobs need them.
  verify-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew ktlintCheck detekt test

  verify-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm test

  build-backend:
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # A GHCR reference must be lowercase, but github.repository keeps the owner's casing
      # ("Kotlin-server-squad/vizcore"), so interpolating it straight into a tag produces an
      # invalid reference and the push fails. Lowercase it once here instead.
      - name: Resolve the lowercase image name and its tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="${REGISTRY}/${REPOSITORY,,}/backend"
          # Every image carries its commit SHA; main also moves `latest`, a v* tag adds itself.
          tags="${name}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags+=$'\n'"${name}:${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=$'\n'"${name}:latest"
          fi
          {
            echo "name=${name}"
            echo "tags<<TAGS"
            echo "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-platform builds need Buildx (#269). No QEMU: the Dockerfile builds the jar on the
      # runner's own platform, and the per-platform runtime stage only copies files.
      - uses: docker/setup-buildx-action@v3

      # Root context: backend/Dockerfile copies backend/ plus every SDK module the default
      # build includes, so the build cannot be scoped to ./backend.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}

      # Apple Silicon pulls the arm64 variant; without it the image runs emulated (#269).
      - name: The pushed image is multi-arch
        run: |
          manifest=$(docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${GITHUB_SHA}")
          for platform in linux/amd64 linux/arm64; do
            grep -q "Platform: *${platform}" <<<"$manifest" || { echo "no ${platform} image"; echo "$manifest"; exit 1; }
          done

  build-frontend:
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the lowercase image name and its tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="${REGISTRY}/${REPOSITORY,,}/frontend"
          # Every image carries its commit SHA; main also moves `latest`, a v* tag adds itself.
          tags="${name}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags+=$'\n'"${name}:${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=$'\n'"${name}:latest"
          fi
          {
            echo "name=${name}"
            echo "tags<<TAGS"
            echo "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-platform builds need Buildx (#269). No QEMU: the Dockerfile runs `pnpm build` on the
      # runner's own platform, and the per-platform nginx stage only copies files.
      - uses: docker/setup-buildx-action@v3

      # Root context: frontend/Dockerfile needs shared/api-types next to frontend/ for
      # `pnpm build` (tsc + vite) to resolve @vizcor/api-types.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}

      # Apple Silicon pulls the arm64 variant; without it the image runs emulated (#269).
      - name: The pushed image is multi-arch
        run: |
          manifest=$(docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${GITHUB_SHA}")
          for platform in linux/amd64 linux/arm64; do
            grep -q "Platform: *${platform}" <<<"$manifest" || { echo "no ${platform} image"; echo "$manifest"; exit 1; }
          done
