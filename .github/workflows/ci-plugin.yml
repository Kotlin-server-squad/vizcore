name: CI IntelliJ Plugin

# The IntelliJ plugin is postponed and is not part of v1.2 (#130). It is excluded from the
# default Gradle build (see backend/settings.gradle.kts) and this workflow therefore runs
# ON DEMAND ONLY — never on push or pull_request. Every Gradle call must pass
# -Pvizcore.withPlugin=true, otherwise the :intellij-plugin project does not exist.
on:
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: ktlint
        run: ./gradlew -Pvizcore.withPlugin=true :intellij-plugin:ktlintCheck

      - name: detekt
        run: ./gradlew -Pvizcore.withPlugin=true :intellij-plugin:detekt

      - name: Build core library
        run: ./gradlew -Pvizcore.withPlugin=true :coroutine-viz-core:jar

      - name: Build plugin
        run: ./gradlew -Pvizcore.withPlugin=true :intellij-plugin:buildPlugin

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
          retention-days: 14
