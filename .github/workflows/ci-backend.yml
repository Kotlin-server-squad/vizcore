name: CI Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

# The IntelliJ plugin is postponed (#130) and is no longer configured or built by this
# workflow: backend/settings.gradle.kts leaves :intellij-plugin out of the build unless
# -Pvizcore.withPlugin=true is passed, so the Gradle calls below (ktlintCheck, detekt, test,
# checkBytecode, build) cover the backend and the SDK modules only. The plugin is built on
# demand by ci-plugin.yml; do not add the opt-in flag here.
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Test
        run: ./gradlew test

      - name: Bytecode guard (JVM-17 floor)
        run: ./gradlew checkBytecode

      - name: Build
        run: ./gradlew build
