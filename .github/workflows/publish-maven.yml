name: Publish to Maven

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (leave empty to use build.gradle.kts version)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '21'

jobs:
  publish:
    name: Publish coroutine-viz-core + coroutine-viz-client to GitHub Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run core tests
        run: ./gradlew :coroutine-viz-core:test

      - name: Run client tests
        run: ./gradlew :coroutine-viz-client:test

      - name: Resolve publish version
        id: version
        env:
          # Route workflow_dispatch / release inputs through env (shell variables,
          # NOT textual ${{ }} substitution into the run: line) to avoid GitHub
          # Actions script injection from untrusted version_override input.
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            VERSION="$VERSION_OVERRIDE"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            # Strip leading 'v' from release tag
            VERSION="${RELEASE_TAG#v}"
          else
            # Fall back to version in build.gradle.kts
            VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' coroutine-viz-core/build.gradle.kts | head -1)
          fi
          # Guard the resolved version against a sane semver-ish shape before it
          # ever reaches a publish coordinate.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "error: resolved version '$VERSION' is not a valid semantic version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :coroutine-viz-core:publish :coroutine-viz-client:publish -Pversion="$PUBLISH_VERSION"

      - name: Summary
        run: |
          echo "### Published coroutine-viz-core + coroutine-viz-client" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Group:** com.jh.coroutine-visualizer" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifacts:** coroutine-viz-core, coroutine-viz-client" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```kotlin' >> "$GITHUB_STEP_SUMMARY"
          echo "implementation(\"com.jh.coroutine-visualizer:coroutine-viz-core:${{ steps.version.outputs.VERSION }}\")" >> "$GITHUB_STEP_SUMMARY"
          echo "implementation(\"com.jh.coroutine-visualizer:coroutine-viz-client:${{ steps.version.outputs.VERSION }}\")" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
