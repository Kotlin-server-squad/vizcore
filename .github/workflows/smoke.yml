name: Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Golden-path smoke test (#133): boots the backend fat jar in memory mode and drives the
# real HTTP/SSE/WebSocket surface, which the module tests cannot cover. The IntelliJ plugin
# is out of the default build (#130), so shadowJar below needs no opt-out flag — and must
# never be passed -Pvizcore.withPlugin=true. Compose E2E and DB-mode boot stay open.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew
        working-directory: backend

      - name: Build fat jar
        run: ./gradlew shadowJar --console=plain
        working-directory: backend

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install smoke dependencies
        run: pip install -r scripts/smoke/requirements.txt

      - name: Run golden-path smoke test
        run: scripts/smoke/run-smoke.sh "$(ls backend/build/libs/*-all.jar | head -1)"

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Root context for both: backend/Dockerfile copies backend/ plus every SDK module in
      # the default build, and frontend/Dockerfile needs shared/api-types next to frontend/.
      # Build only — publishing to ghcr is deploy.yml's job, and never happens on a PR.
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t vizcore-backend:smoke .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --target production -t vizcore-frontend:smoke .

      # The UI image proxies /api to the backend. A gzip-compressed response (anything over 1 KB)
      # must end, and the SSE stream must still reach the browser through the proxy.
      - name: API through the frontend proxy
        run: |
          docker network create vizcore-smoke
          docker run -d --name backend --network vizcore-smoke vizcore-backend:smoke
          docker run -d --name frontend --network vizcore-smoke -p 3000:3000 -p 3080:3000 vizcore-frontend:smoke
          for i in $(seq 1 60); do
            curl -sf --max-time 2 -o /dev/null http://localhost:3000/api/health && break
            [ "$i" = 60 ] && { echo "backend not healthy through the proxy"; exit 1; }
            sleep 2
          done
          curl -sf --compressed --max-time 10 -D headers.txt -o /dev/null -w 'compressed /api/scenarios: %{time_total}s\n' \
            http://localhost:3000/api/scenarios
          grep -qi '^content-encoding: gzip' headers.txt || { echo "expected a gzip response"; cat headers.txt; exit 1; }
          id=$(curl -sf --max-time 5 -X POST 'http://localhost:3000/api/sessions?name=smoke' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sessionId"])')
          # The stream never ends on its own, so curl always stops at --max-time; only its output counts.
          curl -s -N --max-time 5 -o stream.txt "http://localhost:3000/api/sessions/$id/stream" || true
          grep -q connected stream.txt || { echo "no SSE frames through the proxy"; cat stream.txt; exit 1; }

      # A browser sends its page's Origin with every POST. The backend allows only localhost:3000 and
      # 127.0.0.1:3000 by default, so a UI on another loopback port works only if the proxy keeps
      # that port in Host, which makes the request same-origin. A foreign Origin, and a non-loopback Host
      # matching its own Origin (DNS rebinding), must still be rejected.
      - name: Same-origin POST from a UI on another port
        run: |
          post() { curl -s --max-time 5 -o /dev/null -w '%{http_code}' -X POST -H "Host: $1" -H "Origin: $2" \
            'http://localhost:3080/api/sessions?name=origin'; }
          expect() { [ "$1" = "$2" ] || { echo "$3: got $1, expected $2"; exit 1; }; }
          expect "$(post localhost:3080 http://localhost:3080)" 201 "the UI's own POST"
          expect "$(post 127.0.0.1:3080 http://127.0.0.1:3080)" 201 "the UI's own POST on 127.0.0.1"
          expect "$(post '[::1]:3080' 'http://[::1]:3080')" 201 "the UI's own POST on [::1]"
          expect "$(post localhost:3080 http://foreign.example)" 403 "a foreign Origin"
          expect "$(post rebind.example:3080 http://rebind.example:3080)" 403 "a non-loopback Host"

      - name: Container logs
        if: failure()
        run: docker logs backend; docker logs frontend
