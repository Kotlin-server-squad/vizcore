# The Host the backend sees decides whether a POST from this UI counts as same-origin: the
# backend's CORS check compares it, port included, with the page's Origin. $host drops the port,
# so a UI opened on localhost:<any port but 3000> got 403 on every POST. Keep the port only for
# loopback names, which a DNS-rebinding page can't have as its origin; any other name is
# forwarded as before, so cross-port POSTs from it still need CORS_ALLOWED_ORIGINS.
map $host $vizcore_backend_host {
    localhost   $http_host;
    127.0.0.1   $http_host;
    "[::1]"     $http_host;
    default     $host;
}

# The ingest WebSocket (below) needs `Connection: upgrade` to reach the backend as an upgrade.
# A request that doesn't ask for one keeps the empty Connection header /api/ sends.
map $http_upgrade $vizcore_connection {
    default     upgrade;
    ""          "";
}

server {
    listen 3000;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $vizcore_backend_host;
        proxy_buffering off;
        proxy_cache off;
        # Keep nginx's default chunked encoding: the backend gzips JSON over 1 KB and streams it
        # without a Content-Length, so with chunking off the response has no end marker and the
        # browser waits for it forever. SSE is unaffected either way (proxy_buffering off).
    }

    # The SDK streams events over a WebSocket to /api/sessions/{id}/ingest, and the Connect
    # wizard gives apps the UI's own address when the page comes from this image (#252). Without
    # the upgrade headers the backend sees a plain GET and answers 404. Host is the same as for
    # /api/, so the backend's Origin check on the upgrade works exactly as it does for a POST.
    # Listed before the static-asset regex, since the first matching regex wins.
    location ~ ^/api/sessions/[^/]+/ingest$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vizcore_connection;
        proxy_set_header Host $vizcore_backend_host;
        # nginx closes an upgraded socket once the backend has sent nothing for this long. The
        # backend pings every 15 s and drops a peer after 30 s without a pong (WebSockets.kt), so
        # an idle ingest socket stays open and a dead one is closed by the backend first; this
        # only has to stay well above the ping interval.
        proxy_read_timeout 300s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
