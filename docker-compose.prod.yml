# Production stack: pulls the images .github/workflows/deploy.yml publishes, it does not build.
#
# Images live under the repository's own GHCR namespace,
# ghcr.io/kotlin-server-squad/vizcore/{backend,frontend}. GHCR requires a login even for a
# public package pull on some hosts, and always for a private one, so authenticate before
# `docker compose -f docker-compose.prod.yml pull`:
#
#   export CR_PAT=<personal access token with read:packages>
#   echo "$CR_PAT" | docker login ghcr.io -u <github-username> --password-stdin
#
# Env this file reads:
#   TAG                   image tag to run (default `latest`; deploy.yml also tags the commit SHA)
#   BACKEND_PORT          host port for the backend (default 8080)
#   FRONTEND_PORT         host port for the frontend (default 3000)
#   CORS_ALLOWED_ORIGINS  comma-separated origins the backend accepts
#   SESSION_MAX_AGE_MS, SESSION_MAX_COUNT, MAX_CONCURRENT_DEMOS,
#   MAX_DEMO_RUN_SECONDS, DEMO_TIME_SCALE, JAVA_OPTS  backend tuning
#   LOOK_EXPERIMENT_ENABLED, LOOK_EXPERIMENT, LOOK_SURVEY_URL  the look experiment (off by default)
#   PUBLIC_DEMO_MODE      true = a server anyone may open: visitors watch and run the built-in
#                         demos only (docs/DEPLOYMENT.md, "Public demo"). Default false
#   TRUSTED_PROXY_HOPS    number of reverse proxies in front of the backend, this file's frontend
#                         nginx included, so rate limits count visitors and not the proxy
#                         (docs/DEPLOYMENT.md, "Behind a reverse proxy"). Default 0 = trust none.
#                         Before raising it, close the backend port below to the outside: bind
#                         it to 127.0.0.1 or remove its ports entry
#   SEED_USER, SEED_HASH_B64, SEED_ROLE, JWT_SECRET  one user who can sign in, e.g. the admin of
#                         a public demo. Default none
services:
  backend:
    image: ghcr.io/kotlin-server-squad/vizcore/backend:${TAG:-latest}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://your-frontend-domain.com}
      # logback-prod.xml is applied by the Dockerfile ENTRYPOINT (no JAVA_TOOL_OPTIONS needed).
      - SESSION_MAX_AGE_MS=${SESSION_MAX_AGE_MS:-3600000}
      - SESSION_MAX_COUNT=${SESSION_MAX_COUNT:-100}
      - MAX_CONCURRENT_DEMOS=${MAX_CONCURRENT_DEMOS:-3}
      - MAX_DEMO_RUN_SECONDS=${MAX_DEMO_RUN_SECONDS:-60}
      - DEMO_TIME_SCALE=${DEMO_TIME_SCALE:-1.0}
      # The look experiment (docs/guides/look-experiment.md): off unless switched on.
      - LOOK_EXPERIMENT_ENABLED=${LOOK_EXPERIMENT_ENABLED:-false}
      - LOOK_EXPERIMENT=${LOOK_EXPERIMENT:-classic:25,a:25,b:25,c:25}
      - LOOK_SURVEY_URL=${LOOK_SURVEY_URL:-}
      # Public demo (docs/DEPLOYMENT.md): off unless switched on. With it on, a visitor can watch
      # and run the built-in demos; connecting an app, custom scenarios, deleting and sharing need
      # an admin. It keeps sessions in memory, bounded by SESSION_MAX_AGE_MS and SESSION_MAX_COUNT.
      - PUBLIC_DEMO_MODE=${PUBLIC_DEMO_MODE:-false}
      # Behind reverse proxies only: how many stand in front of the backend, the frontend service's
      # nginx included (1 for this file alone, 2 with Traefik in front of it). 0 never reads
      # X-Forwarded-For; do not raise it while the backend port above is reachable directly.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
      # One user who can sign in on /login, for a public demo's admin (SEED_ROLE=admin). All empty:
      # no user, and no sign-in is asked for.
      - SEED_USER=${SEED_USER:-}
      - SEED_HASH_B64=${SEED_HASH_B64:-}
      - SEED_ROLE=${SEED_ROLE:-viewer}
      - JWT_SECRET=${JWT_SECRET:-}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    healthcheck:
      # Same readiness probe as the dev stack; curl ships with eclipse-temurin:21-jre.
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/kotlin-server-squad/vizcore/frontend:${TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
